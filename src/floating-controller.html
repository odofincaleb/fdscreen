<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recording Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }
        .controller {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            height: 50px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            font-size: 11px;
            font-weight: 500;
        }
        .recording-dot {
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .controls {
            display: flex;
            gap: 4px;
            -webkit-app-region: no-drag;
        }
        .control-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
        }
        .control-btn.pause { background: rgba(255, 193, 7, 0.2); }
        .control-btn.stop { background: rgba(220, 53, 69, 0.2); }
        .timer {
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            font-family: Consolas, 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="controller">
        <div class="status">
            <div class="recording-dot"></div>
            <span class="timer" id="timer">00:00</span>
        </div>
        <div class="controls">
            <button class="control-btn pause" id="pauseBtn" title="Pause/Resume">⏸</button>
            <button class="control-btn stop" id="stopBtn" title="Stop Recording">⏹</button>
        </div>
    </div>
    <script>
        let startTime = Date.now();
        let isPaused = false;
        let pausedTime = 0;
        let timerInterval;
        let isRecording = false;

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (!isRecording || isPaused) return;
            const elapsed = Math.floor((Date.now() - startTime + pausedTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }

        document.getElementById('pauseBtn').addEventListener('click', (event) => {
            event.preventDefault();
            if (!isRecording) return;
            window.electronAPI?.sendFloatingControllerAction('pause-resume');
        });

        document.getElementById('stopBtn').addEventListener('click', (event) => {
            event.preventDefault();
            if (!isRecording) return;
            window.electronAPI?.sendFloatingControllerAction('stop');
        });

        if (window.electronAPI?.onRecordingStateChange) {
            window.electronAPI.onRecordingStateChange((state, data) => {
                if (state === 'started') {
                    isRecording = true;
                    isPaused = false;
                    startTime = data?.startTime || Date.now();
                    pausedTime = data?.pausedTime || 0;
                    document.getElementById('timer').textContent = '00:00';
                    document.getElementById('pauseBtn').textContent = '⏸';
                    startTimer();
                } else if (state === 'paused') {
                    isPaused = true;
                    if (data?.pausedTime !== undefined) pausedTime = data.pausedTime;
                    clearInterval(timerInterval);
                    document.getElementById('pauseBtn').textContent = '▶';
                } else if (state === 'resumed') {
                    isPaused = false;
                    startTime = data?.startTime || Date.now();
                    pausedTime = data?.pausedTime || 0;
                    document.getElementById('pauseBtn').textContent = '⏸';
                    startTimer();
                } else if (state === 'stopped') {
                    isRecording = false;
                    isPaused = false;
                    clearInterval(timerInterval);
                    document.getElementById('timer').textContent = '00:00';
                    document.getElementById('pauseBtn').textContent = '⏸';
                }
            });
        }
    </script>
</body>
</html>
